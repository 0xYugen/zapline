# Flathub manifest. Packages the Linux release tarball built by
# .github/workflows/release.yml. Before submitting: replace OWNER, set the
# release URL and its sha256 (from SHA256SUMS.txt), add a 256x256 icon.
app-id: io.github.OWNER.Lineup
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: lineup
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # Streams, guides and the LAN pairing page.
  - --share=network
  # Source passwords via libsecret.
  - --talk-name=org.freedesktop.secrets
modules:
  # libmpv for playback (LGPL build: no GPL-only options enabled).
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dgpl=false
      - -Dcplayer=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.40.0.tar.gz
        sha256: REPLACE_WITH_SHA256
  - name: lineup
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/lineup
      - cp -r bundle/* /app/lib/lineup/
      - mkdir -p /app/bin && ln -s /app/lib/lineup/lineup /app/bin/lineup
      - install -Dm644 lineup.desktop /app/share/applications/io.github.OWNER.Lineup.desktop
      - install -Dm644 io.github.OWNER.Lineup.metainfo.xml /app/share/metainfo/io.github.OWNER.Lineup.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/OWNER/lineup/releases/download/v0.1.0/lineup-linux-x64.tar.gz
        sha256: REPLACE_WITH_SHA256
        dest: bundle
        strip-components: 0
      - type: file
        path: ../linux/lineup.desktop
      - type: file
        path: ../linux/io.github.OWNER.Lineup.metainfo.xml
