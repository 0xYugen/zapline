name: zapline
description: "Free, open-source IPTV player"
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  zapline_core:
    path: ../../packages/zapline_core
  http: ^1.2.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  video_player: ^2.14.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_ios_video: ^1.1.4
  path_provider: ^2.1.6
  zapline_data:
    path: ../../packages/zapline_data
  qr_flutter: ^4.1.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
  # Inter (SIL Open Font License 1.1, assets/fonts/inter/OFL.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
  assets:
    - assets/fonts/inter/OFL.txt
