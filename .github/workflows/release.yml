name: Release

# Builds every platform when a version tag is pushed (e.g. v0.2.0) and
# attaches the files to a draft GitHub release for review before publishing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAPLINE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ZAPLINE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured: APKs are debug-signed."
          fi
      - name: Build APKs and App Bundle
        working-directory: apps/zapline
        env:
          ZAPLINE_KEYSTORE_PASSWORD: ${{ secrets.ZAPLINE_KEYSTORE_PASSWORD }}
          ZAPLINE_KEY_ALIAS: ${{ secrets.ZAPLINE_KEY_ALIAS }}
          ZAPLINE_KEY_PASSWORD: ${{ secrets.ZAPLINE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/zapline/build/app/outputs/flutter-apk/*-release.apk
            apps/zapline/build/app/outputs/bundle/release/app-release.aab

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: apps/zapline
        run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path apps/zapline/build/windows/x64/runner/Release/* -DestinationPath zapline-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: zapline-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: apps/zapline
        run: flutter build linux --release
      - name: Tarball
        run: tar -C apps/zapline/build/linux/x64/release/bundle -czf zapline-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: zapline-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: apps/zapline
        run: flutter build macos --release
      - name: Zip (unsigned)
        run: ditto -c -k --keepParent apps/zapline/build/macos/Build/Products/Release/zapline.app zapline-macos-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: zapline-macos-unsigned.zip

  release:
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Flatten and checksum
        working-directory: dist
        run: |
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -empty -delete
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
