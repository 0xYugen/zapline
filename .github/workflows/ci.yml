name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed packages
      - run: dart analyze --fatal-infos packages/zapline_core
      - run: dart test
        working-directory: packages/zapline_core
      - run: dart analyze --fatal-infos packages/zapline_data
      - run: dart test
        working-directory: packages/zapline_data

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/zapline
      - run: flutter analyze --fatal-infos
        working-directory: apps/zapline
      - run: flutter test
        working-directory: apps/zapline
