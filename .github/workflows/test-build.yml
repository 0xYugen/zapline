name: Test build

# Android APKs of a work branch, signed with the release key so they update
# the installed app (keeping its data), attached to a draft release only
# the repository's maintainers can see. Nothing is published: the draft
# has no tag until someone publishes it, and the app's update check never
# sees drafts.
on:
  push:
    branches: ['claude/ui-ux-performance-analysis-xhu0jl']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version code is the commit count: needs full history.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAPLINE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing key: a test build must update the installed app."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ZAPLINE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Build APKs
        working-directory: apps/zapline
        env:
          ZAPLINE_KEYSTORE_PASSWORD: ${{ secrets.ZAPLINE_KEYSTORE_PASSWORD }}
          ZAPLINE_KEY_ALIAS: ${{ secrets.ZAPLINE_KEY_ALIAS }}
          ZAPLINE_KEY_PASSWORD: ${{ secrets.ZAPLINE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          # TV and Fire TV: 32 and 64-bit.
          sh tool/build_android.sh apk --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk dist/zapline-tv.apk
          # Phones: 64-bit only.
          sh tool/build_android.sh apk --split-per-abi --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/zapline-phone.apk
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: v0.1.0-${{ env.CODE }}-test
          target_commitish: ${{ github.sha }}
          name: Test build ${{ env.CODE }}
          body: |
            Test build of `${{ github.ref_name }}` at ${{ github.sha }}.
            Signed with the release key: it updates the installed Zapline and keeps its data.
          files: apps/zapline/dist/*
